# Pipeline Configuration Defaults

app:
  env: "development"
  log_level: "INFO"
  data_dir: "data"
  upload_dir: "data/uploads"
  index_dir: "data/indices"
  reports_dir: "reports"

ingestion:
  max_file_size_mb: 25
  allowed_extensions: [".pdf", ".txt", ".md", ".json", ".csv"]
  normalize_unicode: true
  remove_duplicate_docs: true

chunking:
  default_strategy: "recursive" # "fixed", "recursive", "semantic"
  chunk_size: 512
  chunk_overlap: 64
  separators: ["\n\n", "\n", ". ", " ", ""]

embeddings:
  model_name: "all-MiniLM-L6-v2"
  batch_size: 32
  normalize: true
  cache_embeddings: true
  device: "cpu"

retrieval:
  top_k: 5
  dense_weight: 0.5
  sparse_weight: 0.5
  rrf_k: 60
  similarity_threshold: 0.0

reranking:
  enabled: true
  model_name: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  top_n: 3

generation:
  provider: "mock" # "mock", "gemini", "huggingface"
  temperature: 0.0
  max_tokens: 512
  abstention_threshold: 0.15
  require_citations: true
  abstention_message: "I do not have sufficient information in the provided context to answer this question."

