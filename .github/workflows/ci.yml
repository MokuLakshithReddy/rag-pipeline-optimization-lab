name: CI Pipeline & Retrieval Benchmarks

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-benchmark:
    name: Test & Benchmark Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install --upgrade uv

      - name: Install Project & Dependencies
        run: |
          uv pip install --system -e ".[dev]"

      - name: Execute Full Pytest Test Suite
        run: |
          pytest tests -v --strict-markers

      - name: Execute Controlled Benchmark Suite
        run: |
          python src/experiments/runner.py --llm-provider mock

      - name: Verify Benchmark Artifacts
        run: |
          test -f reports/benchmark_results.csv
          test -f reports/experiment_summary.md
          test -f reports/retrieval_analysis.md

      - name: Execute Repeatable Performance SLA Benchmark
        run: |
          python src/experiments/benchmark_performance.py

      - name: Verify Performance Artifacts
        run: |
          test -f reports/performance_sla_report.json
          test -f reports/performance_sla_report.md

